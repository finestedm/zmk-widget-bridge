[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zmk-widget-sync"
version = "0.1.0"
description = "Linux weather and Google Calendar companion for ZMK displays"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "bleak>=1.1,<4",
  "google-api-python-client>=2.0,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
zmk-widget-sync = "zmk_widget_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
